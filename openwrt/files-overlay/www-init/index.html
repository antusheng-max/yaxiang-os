<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yaxiang OS 首次初始化</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#eef2f7}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(92vw,480px);background:#fff;padding:32px;border-radius:16px;box-shadow:0 18px 50px #1b355522}
    h1{margin:0 0 8px;font-size:24px} p{color:#526174;line-height:1.6}
    label{display:block;margin:18px 0 6px;font-weight:650}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c4d1;border-radius:8px;font-size:16px}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-weight:700;font-size:16px}
    button:disabled{opacity:.6}.status{min-height:24px;margin-top:16px;color:#b42318}.ok{color:#067647}
  </style>
</head>
<body>
  <main>
    <h1>Yaxiang OS 首次初始化</h1>
    <p>完整管理后台与 SSH 当前均已关闭。请先设置设备专用的 root 强密码；密码仅提交到本机并保存在 overlay 中。</p>
    <form id="setup">
      <label for="password">新密码</label>
      <input id="password" type="password" minlength="12" maxlength="64" autocomplete="new-password" required>
      <label for="confirm">确认密码</label>
      <input id="confirm" type="password" minlength="12" maxlength="64" autocomplete="new-password" required>
      <p>至少 12 位，且同时包含大写、小写、数字和符号。</p>
      <button id="submit" type="submit">设置密码并启用 LAN 管理</button>
      <div id="status" class="status" role="alert"></div>
    </form>
  </main>
  <script>
    if (location.protocol !== 'https:') location.replace('https://' + location.hostname + '/');
    const form = document.querySelector('#setup');
    const status = document.querySelector('#status');
    const submit = document.querySelector('#submit');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.querySelector('#password').value;
      const confirm = document.querySelector('#confirm').value;
      status.className = 'status';
      if (password !== confirm) { status.textContent = '两次输入的密码不一致。'; return; }
      submit.disabled = true;
      try {
        const response = await fetch('/cgi-bin/yaxiang-initialize', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password, confirm})
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || '初始化失败');
        status.className = 'status ok';
        status.textContent = '初始化成功。正在进入管理后台……';
        setTimeout(() => location.replace('https://' + location.hostname + '/'), 2500);
      } catch (error) {
        status.textContent = error.message;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
