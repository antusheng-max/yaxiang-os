# ============================================================
# 亚象网络操作系统 - GRUB 启动配置
# Yaxiang OS Installer GRUB Configuration
# V0.3-dev
# ============================================================

set default=0
set timeout=5

# 启用串口终端 (115200 baud) + 图形终端
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi

insmod gfxterm
insmod font
insmod iso9660
insmod search_label

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768
    terminal_output gfxterm serial
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# 使用 search 查找 ISO 卷标 (兼容 BIOS 和 UEFI)
search --no-floppy --set=root --label YAXIANG_OS_INSTALLER

menuentry "启动亚象安装程序 (Start Yaxiang Installer)" {
    linux /boot/vmlinuz boot=live console=tty1 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "硬件兼容模式 (Safe Graphics / Compatibility)" {
    linux /boot/vmlinuz boot=live nomodeset acpi=off console=tty1 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "进入维护环境 (Maintenance Shell)" {
    linux /boot/vmlinuz boot=live single console=tty1 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "重启 (Reboot)" {
    reboot
}

menuentry "关机 (Power Off)" {
    halt
}
