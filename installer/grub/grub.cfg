# ============================================================
# Yaxiang OS - GRUB Boot Configuration
# V0.3-dev (final release)
# ============================================================

set default=0
set timeout=5

# Serial console (115200 baud) + graphical terminal
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi

insmod gfxterm
insmod font
insmod iso9660
insmod search_label

if loadfont /boot/grub/fonts/yaxiang-cjk.pf2 ; then
    set gfxmode=1024x768
    terminal_output gfxterm serial
elif loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768
    terminal_output gfxterm serial
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Locate ISO by volume label (BIOS + UEFI compatible)
search --no-floppy --set=root --label YAXIANG_OS_INSTALLER

menuentry "Yaxiang OS Installer (Start Installation)" {
    linux /boot/vmlinuz boot=live console=tty1 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "Safe Graphics Mode (Compatibility)" {
    linux /boot/vmlinuz boot=live nomodeset acpi=off console=tty1 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "Maintenance Shell" {
    linux /boot/vmlinuz boot=live single console=tty1 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
