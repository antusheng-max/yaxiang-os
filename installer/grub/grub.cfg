# ============================================================
# 亚象网络操作系统 - GRUB 启动配置
# Yaxiang OS Installer GRUB Configuration
# V0.2-dev
# ============================================================

set default=0
set timeout=5

if [ "${grub_platform}" = "efi" ]; then
    set gfxmode=1024x768
    insmod efi_gop
    insmod efi_uga
else
    set gfxmode=1024x768
    insmod vbe
    insmod vga
fi

insmod gfxterm
insmod font

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "启动亚象安装程序 (Start Yaxiang Installer)" {
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet splash console=tty1
    initrd /boot/initrd.img
}

menuentry "启动亚象安装程序 - 串口控制台 (Serial Console)" {
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "硬件兼容模式 (Safe Graphics / Compatibility)" {
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet nomodeset acpi=off console=tty1
    initrd /boot/initrd.img
}

menuentry "进入维护环境 (Maintenance Shell)" {
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet single console=tty1
    initrd /boot/initrd.img
}

menuentry "重启 (Reboot)" {
    reboot
}

menuentry "关机 (Power Off)" {
    halt
}
